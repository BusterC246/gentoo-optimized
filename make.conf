# Gentoo Portage configuration — host-agnostic shared settings.
#
# This file is a TEMPLATE for /etc/portage/make.conf. Values that differ
# per machine (CPU count, RAM, GPU) are replaced at sync time by sync.sh:
#
#   ./sync.sh apply   expand placeholders and install to /etc/portage
#   ./sync.sh pull    import /etc/portage back into this repo
#   ./sync.sh check   validate without changing anything
#
# Do not use this file directly as /etc/portage/make.conf — run sync.sh apply.
#
# References:
#   https://wiki.gentoo.org/wiki//etc/portage/make.conf
#   https://wiki.gentoo.org/wiki/CPU_FLAGS_*
#   https://wiki.gentoo.org/wiki/MAKEOPTS
#   https://wiki.gentoo.org/wiki//etc/portage/package.env

# Built from the live system's /etc/portage/make.conf with host-specific
# lines (CPU_FLAGS_X86, VIDEO_CARDS) removed and hardware-derived values
# replaced by placeholders at sync time.

COMMON_FLAGS="-O2 -march=native -pipe"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CGO_CFLAGS="${COMMON_FLAGS}"
CGO_CXXFLAGS="${COMMON_FLAGS}"
CGO_FFLAGS="${COMMON_FLAGS}"
CGO_LDFLAGS="${LDFLAGS}"

RUSTFLAGS="-C target-cpu=native -C strip=debuginfo -C opt-level=3"

# Hardware-derived by sync.sh apply (CPU count / RAM). The values computed
# for the current machine are shown with ./sync.sh --simulate.
MAKEOPTS="@MAKEOPTS@"
EMERGE_DEFAULT_OPTS="@EMERGE_DEFAULT_OPTS@"

FEATURES="candy compress-build-logs compressdebug dedupdebug parallel-fetch parallel-install splitdebug"

PORTAGE_SCHEDULING_POLICY="idle"
PORTAGE_NICENESS="19"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"

USE="asm audit bluetooth dbus dist-kernel ffmpeg gles2 jit lm-sensors lto
     modules-compress native-extensions networkmanager nftables orc pgo
     pipewire pulseaudio screencast strip syslog uefi vaapi vdpau wayland wifi
     zstd -bluray -cdr -dvb -dvd -gnome -gnome-keyring -ios -kde -plasma
     -systemd -telemetry"

GRUB_PLATFORMS="efi-64"

ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"
LC_MESSAGES=C.utf8
